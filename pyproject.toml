[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-remote"
version = "0.1.0"
description = "LAN-only PWA + agents to control a Windows laptop and Ubuntu server from a phone"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "zeroconf>=0.131",
  "pydantic>=2.6",
]

[project.optional-dependencies]
laptop = [
  "pyautogui>=0.9.54",
]
server = []
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.3",
]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
